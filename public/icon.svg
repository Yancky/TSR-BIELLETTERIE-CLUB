<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0F2C59"/>
  <!-- Decorative border ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#F59E0B" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>
  <!-- Bus icon stylized -->
  <g transform="translate(106, 96)">
    <!-- Bus body -->
    <rect x="20" y="20" width="260" height="250" rx="36" fill="#1E3A8A" stroke="#F59E0B" stroke-width="12"/>
    <!-- Windshield -->
    <rect x="44" y="44" width="212" height="90" rx="16" fill="#60A5FA"/>
    <line x1="150" y1="44" x2="150" y2="134" stroke="#1E3A8A" stroke-width="6"/>
    <!-- Headlights -->
    <circle cx="64" cy="180" r="18" fill="#FDE047"/>
    <circle cx="236" cy="180" r="18" fill="#FDE047"/>
    <!-- Grille -->
    <rect x="100" y="165" width="100" height="30" rx="8" fill="#0F172A"/>
    <line x1="115" y1="180" x2="185" y2="180" stroke="#F59E0B" stroke-width="4"/>
    <!-- Wheels -->
    <rect x="36" y="270" width="48" height="36" rx="10" fill="#0F172A"/>
    <rect x="216" y="270" width="48" height="36" rx="10" fill="#0F172A"/>
  </g>
  <!-- Text TSR TRANSIT -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#F59E0B" text-anchor="middle" letter-spacing="3">TSR TRANSIT</text>
  <text x="256" y="480" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="20" fill="#E2E8F0" text-anchor="middle">BURKINA FASO</text>
</svg>
